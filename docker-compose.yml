version: '3.8'

networks:
  backend:

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 2

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      backend:
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s 
      timeout: 5s 
      retries: 2

  auth:
    build: ./services/auth
    container_name: auth_service
    env_file: .env
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5001/health']
      interval: 10s 
      timeout: 5s 
      retries: 2

  users:
    build: ./services/users
    container_name: users_service
    env_file: .env
    ports:
      - "5002:5002"
    depends_on:
      auth:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5002/health']
      interval: 10s 
      timeout: 5s 
      retries: 2

  orders:
    build: ./services/orders 
    container_name: orders_service
    env_file: .env
    ports:
      - "5003:5003"
    depends_on:
      auth:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/health']
      interval: 10s 
      timeout: 5s 
      retries: 2

volumes:
  postgres_data:
  redis_data:
