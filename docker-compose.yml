version: '3.8'

networks:
  backend:

services:
  postgres:
    image: postgres:latest
    container_name: postgres_db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  auth:
    build: ./services/auth
    container_name: auth_service
    env_file: .env
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - backend

volumes:
  postgres_data:
