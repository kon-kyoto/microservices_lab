version: '3.8'

networks:
  frontend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true" # connect between docker in network
      com.docker.network.bridge.enable_ip_masquerade: "true" # trffic out
  backend:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"

services:

  nginx:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    container_name: nginx_gateway
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend
      - backend
    depends_on:
      auth:
        condition: service_healthy
      users:
        condition: service_healthy
      orders:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # only ports < 1024
    read_only: true
    tmpfs:
      - /tmp 
      - /var/cache/nginx 
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M 
        reservations:
          cpus: '0.25'
          memory: 128M

  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    env_file: .env
    volumes:
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro # ro - ReadOnly
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s 
    security_opt:
      - no-new-privileges:true 
    cap_drop:
      - ALL
    deploy:
      resoureces:
        limits:
          cpus: '1.0'
          memory: 256M 
        reservations:
          cpus: '0.5'
          memory: 256M 

  redis:
    image: redis:7-alpine
    container_name: redis
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD} --protected-mode yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 30s 
      timeout: 1s 
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true 
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memoty: 256M

  auth:
    build: ./services/auth
    container_name: auth_service
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5001/health']
      interval: 10s 
      timeout: 5s 
      retries: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    environment:
      - FLASK_MOD=prod 
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M 
        reservations:
          cpus: '0.25'
          memory: 256M

  users:
    build: ./services/users
    container_name: users_service
    env_file: .env
    depends_on:
      auth:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5002/health']
      interval: 10s 
      timeout: 5s 
      retries: 2
    security_opt:
      - no-new-privileges:true 
    cap_drop:
      - ALL
    user: "1000:1000"
    environment:
      - FLASK_MOD=prod
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M 

  orders:
    build: ./services/orders 
    container_name: orders_service
    env_file: .env
    depends_on:
      auth:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5003/health']
      interval: 10s 
      timeout: 5s 
      retries: 2
    security_opt:
      - no-new-privileges:true 
    cap_drop:
      - ALL 
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data:
    driver: local
  redis_data:
