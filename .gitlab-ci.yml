stages:
  - validate
  - build
  - deploy

# ===================
# VALIDATE
# ===================

python-format:
  stage: validate
  image: python:3.12-slim
  script:
    - pip install black==24.8.0
    - echo "Checking Python formatting with black..."
    - black --check --diff --color infrastructure/ services/ tests/ || (echo "❌ Python formatting failed. Run 'black infrastructure/ services/ tests/' locally to fix." && exit 1)
    - echo "✅ Python formatting OK"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
#
terraform-format:
  stage: validate
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  script:
    - cd terraform
    - echo "Checking Terraform formatting..."
    - terraform fmt -check -recursive -diff || (echo "❌ Terraform formatting failed. Run 'terraform fmt -recursive' locally to fix." && exit 1)
    - echo "✅ Terraform formatting OK"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - changes:
        - terraform/**/*
#
yaml-lint:
  stage: validate
  image: python:3.12-slim
  script:
    - pip install yamllint
    - echo "Checking YAML syntax..."
    - yamllint -d relaxed k8s/ .gitlab-ci.yml || (echo "❌ YAML validation failed. Check yamllint output above." && exit 1)
    - echo "✅ YAML validation OK"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

# ===================
# BUILD
# ===================

build-images:
  stage: build
  image: docker:24.0.5-cli
  services:
    - name: docker:24.0.5-dind
      alias: docker
      command: ["--insecure-registry=172.17.0.1:5050"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker info
    - echo "Building images with tag $CI_COMMIT_SHORT_SHA"
    - docker build -f ./gateway/Dockerfile . -t $CI_REGISTRY_IMAGE/ordernginx:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/ordernginx:$CI_COMMIT_SHORT_SHA
    - docker build -f ./services/auth/Dockerfile ./services/auth/ -t $CI_REGISTRY_IMAGE/orderauth:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/orderauth:$CI_COMMIT_SHORT_SHA
    - docker build -f ./services/users/Dockerfile ./services/users/ -t $CI_REGISTRY_IMAGE/orderusers:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/orderusers:$CI_COMMIT_SHORT_SHA
    - docker build -f ./services/orders/Dockerfile ./services/orders/ -t $CI_REGISTRY_IMAGE/orderorders:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/orderorders:$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - services/**/*
        - gateway/**/*
        - frontend/**/*

deploy-to-kubespray:
  stage: deploy
  image: bitnami/kubectl:latest
  needs:
    - job: build-images
      optional: true
  before_script:
    - mkdir -p ~/.kube
    - cp "$KUBE_CONFIG" ~/.kube/config
    - chmod 600 ~/.kube/config
    - kubectl config set-cluster cluster.local --insecure-skip-tls-verify=true
  script:
    - kubectl create namespace app-ns --dry-run=client -o yaml | kubectl apply -f -
    - kubectl create configmap init-db --from-file=./infrastructure/postgres/init.sql -n app-ns --dry-run=client -o yaml | kubectl apply -f -
    
    - kubectl create secret docker-registry gitlab-registry-secret -n app-ns \
        --docker-server=$CI_REGISTRY \
        --docker-username=$CI_REGISTRY_USER \
        --docker-password=$GITLAB_REGISTRY_TOKEN \
        --dry-run=client -o yaml | kubectl apply -f -

    - kubectl apply -f k8s/pvc.yaml
    - kubectl apply -f k8s/service.yaml
    - kubectl apply -f k8s/ingress.yaml
    - kubectl apply -f k8s/deployment.yaml
    - kubectl apply -f k8s/sealed-secrets.yaml || true

    - kubectl set image deployment/auth-service auth=$CI_REGISTRY_IMAGE/orderauth:$CI_COMMIT_SHORT_SHA -n app-ns
    - kubectl set image deployment/users-service users=$CI_REGISTRY_IMAGE/orderusers:$CI_COMMIT_SHORT_SHA -n app-ns
    - kubectl set image deployment/orders-service orders=$CI_REGISTRY_IMAGE/orderorders:$CI_COMMIT_SHORT_SHA -n app-ns
    - kubectl set image deployment/frontend-gateway nginx=$CI_REGISTRY_IMAGE/ordernginx:$CI_COMMIT_SHORT_SHA -n app-ns

    - kubectl rollout status deployment/auth-service -n app-ns --timeout=180s
    - kubectl rollout status deployment/users-service -n app-ns --timeout=180s
    - kubectl rollout status deployment/orders-service -n app-ns --timeout=180s
    - kubectl rollout status deployment/frontend-gateway -n app-ns --timeout=180s
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
  allow_failure: false
