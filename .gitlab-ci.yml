stages:
  - validate
  - build
  - deploy

# ===================
# VALIDATE 
# ===================

python-format:
  stage: validate
  image: python:3.12-slim
  script:
    - pip install black==24.8.0
    - echo "Checking Python formatting with black..."
    - black --check --diff --color infrastructure/ services/ tests/ || (echo "❌ Python formatting failed. Run 'black infrastructure/ services/ tests/' locally to fix." && exit 1)
    - echo "✅ Python formatting OK"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
#
terraform-format:
  stage: validate
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  script:
    - cd terraform
    - echo "Checking Terraform formatting..."
    - terraform fmt -check -recursive -diff || (echo "❌ Terraform formatting failed. Run 'terraform fmt -recursive' locally to fix." && exit 1)
    - echo "✅ Terraform formatting OK"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - changes:
        - terraform/**/*
#
yaml-lint:
  stage: validate
  image: python:3.12-slim
  script:
    - pip install yamllint
    - echo "Checking YAML syntax..."
    - yamllint -d relaxed k8s/ .gitlab-ci.yml || (echo "❌ YAML validation failed. Check yamllint output above." && exit 1)
    - echo "✅ YAML validation OK"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

# ===================
# BUILD
# ===================

build-images:
  stage: build
  image: docker:24.0.5-cli
  services:
    - name: docker:24.0.5-dind
      alias: docker
      command: ["--insecure-registry=172.17.0.1:5050"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker info
    - echo "Building images with tag $CI_COMMIT_SHORT_SHA"
    - docker build -f ./gateway/Dockerfile . -t $CI_REGISTRY_IMAGE/ordernginx:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/ordernginx:$CI_COMMIT_SHORT_SHA
    - docker build -f ./services/auth/Dockerfile ./services/auth/ -t $CI_REGISTRY_IMAGE/orderauth:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/orderauth:$CI_COMMIT_SHORT_SHA
    - docker build -f ./services/users/Dockerfile ./services/users/ -t $CI_REGISTRY_IMAGE/orderusers:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/orderusers:$CI_COMMIT_SHORT_SHA
    - docker build -f ./services/orders/Dockerfile ./services/orders/ -t $CI_REGISTRY_IMAGE/orderorders:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/orderorders:$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - services/**/*
        - gateway/**/*
        - frontend/**/*

stages:
  - validate
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
