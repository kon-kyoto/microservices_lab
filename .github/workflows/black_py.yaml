name: black-python

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  auto-format:
    name: check-black-code
    runs-on: ubuntu-22.04
    steps:
      - name: Check-code
        uses: actions/checkout@v4

      - name: Setup-Python
        uses: actions/setup-python@v5 
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install-Black
        run: |
          pip install --upgrade pip
          pip install black

      - name: Check-Format
        run: black . --check --diff --color
