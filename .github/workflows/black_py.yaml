name: black-python

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  auto-format:
    name: check-black-code
    runs-on: ubuntu-22.04
    steps:
      - user: actions/checkout@v4
      - name: Install-Black
        run: pip install black
      - name: Check-Format
        run: black . --check
