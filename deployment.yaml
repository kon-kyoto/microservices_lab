---
# =========================
# FRONTEND + GATEWAY(NGINX)
# =========================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-gateway
  namespace: app-ns
  labels:
    app: orderApp
    component: gateway
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  selector:
    matchLabels:
      app: orderApp 
      component: gateway

  template:
    metadata:
      labels:
        app: orderApp
        component: gateway
    spec:
      containers:
      - name: nginx 
        image: ordernginx:1.0

        ports:
        - containerPort: 80
          name: http
          protocol: TCP

        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf          
          subPath: nginx.conf
        - name: frontend-files
          mountPath: /usr/share/nginx/html

        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"

        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10 

        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-gateway-config
      - name: frontend-files
        configMap:
          name: frontend-html



