---
# =========================
# FRONTEND + GATEWAY(NGINX)
# =========================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-gateway
  namespace: app-ns
  labels:
    app: orderApp
    component: gateway
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  selector:
    matchLabels:
      app: orderApp 
      component: gateway

  template:
    metadata:
      labels:
        app: orderApp
        component: gateway
    spec:
      containers:
      - name: nginx 
        image: ordernginx:1.0

        ports:
        - containerPort: 80
          name: http
          protocol: TCP

        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf          
          subPath: nginx.conf
        - name: frontend-files
          mountPath: /usr/share/nginx/html

        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"

        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10 

        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-gateway-config
      - name: frontend-files
        configMap:
          name: frontend-html

---
# =========================
# AUTH SERVICE 
# =========================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service 
  namespace: app-ns
  labels:
    app: orderApp
    component: auth
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  selector:
    matchLabels:
      app: orderApp 
      component: auth

  template:
    metadata:
      labels:
        app: orderApp
        component: auth
  spec:
      containers:
        - name: auth 
          image: orderauth:1.0
          
          ports:
          - containerPort: 5001

            env:
            - name: FLASK_MOD
              value: "dev"
            - name: POSTGRES_HOST
              value: "postgres"
            - name: DB_NAME
              value: "microservices_db"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "password"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: SECRET_KEY
              value: "develop"
            - name: TIMEDELTA
              value: "24"

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10 

          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 20
