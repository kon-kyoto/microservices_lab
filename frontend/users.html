<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление пользователями - Админ</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo-small">
                <h2>OrderSystem</h2>
            </div>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">Заказы</a>
                <a href="users.html" class="nav-link active">Пользователи</a>
                <button id="logoutBtn" class="btn-logout">Выйти</button>
            </div>
        </div>
    </nav>

    <div class="main-container users-container">
        <div class="users-header">
            <h1>Управление пользователями</h1>
            <div class="stats" id="userStats"></div>
        </div>
        
        <div id="usersList" class="users-list">
            <div class="loading">Загрузка пользователей...</div>
        </div>
    </div>

    <!-- Модальное окно редактирования пользователя -->
    <div id="editUserModal" class="modal">
        <div class="modal-content">
            <span class="close-edit">&times;</span>
            <h2>Редактировать пользователя</h2>
            <form id="editUserForm">
                <input type="hidden" id="editUserId">
                <div class="form-group">
                    <label>Имя пользователя</label>
                    <input type="text" id="editUsername" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="editEmail" required>
                </div>
                <button type="submit" class="btn-primary">Сохранить</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/users.js"></script>
</body>
</html>
